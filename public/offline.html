<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Offline — CorperSafe</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #0a0f14;
        color: #e2e8f0;
        text-align: center;
        padding: 1.5rem;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: #059669;
        display: grid;
        place-items: center;
        font-size: 36px;
        margin: 0 auto 1.25rem;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #94a3b8;
        max-width: 34ch;
        margin: 0 auto 1.5rem;
        line-height: 1.5;
      }
      button {
        background: #059669;
        color: #fff;
        font-weight: 700;
        border: 0;
        border-radius: 12px;
        padding: 0.85rem 1.75rem;
        font-size: 1rem;
        cursor: pointer;
      }
      .note {
        font-size: 0.75rem;
        color: #64748b;
        margin-top: 1.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="badge">🛡️</div>
      <h1>You&apos;re offline</h1>
      <p>
        CorperSafe will reconnect automatically. If you were tracking a
        trip, your GPS points are being saved on this device and will sync
        when coverage returns.
      </p>
      <button onclick="location.reload()">Try again</button>
      <p class="note">CorperSafe — travel to camp, arrive safely.</p>
    </main>
  </body>
</html>
